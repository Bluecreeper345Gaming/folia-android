name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm ci

      - name: Create Local Environment File
        run: cp .env.example .env.local

      - name: Ensure Reference Router Exists
        run: |
          mkdir -p src/audioNative/reference
          if [ ! -f src/audioNative/reference/router.ts ] && [ ! -f src/audioNative/reference/router.js ] && [ ! -f src/audioNative/reference/router/index.ts ]; then
            echo 'export const handleApiRequest = async () => {}; export default {};' > src/audioNative/reference/router.ts
          fi

      - name: Build Web Assets
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
